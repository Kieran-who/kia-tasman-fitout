<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="Inter, Segoe UI, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,2 L5,5 L0,8 M10,2 L5,5 L10,8" fill="none" stroke="#c92a2a" stroke-width="1.4"/></marker><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#adb5bd" stroke-width="1.2"/></pattern></defs><style>.o{fill:none;stroke:#212529;stroke-width:1.5}.l{fill:none;stroke:#868e96;stroke-width:1;stroke-dasharray:5 3}.f{fill:#e9ecef;stroke:#495057;stroke-width:1.2}.h{fill:url(#hat);stroke:#495057;stroke-width:1.2}.c{fill:none;stroke:#495057;stroke-width:0.8;stroke-dasharray:12 3 2 3}.dim{stroke:#c92a2a;stroke-width:1.1}.ext{stroke:#c92a2a;stroke-width:0.6;opacity:.7}.lead{stroke:#c92a2a;stroke-width:0.9}.bub{fill:#fff;stroke:#c92a2a;stroke-width:1.2}.bt{fill:#c92a2a;font-weight:700}.t{fill:#343a40}.n{fill:#495057;font-style:italic}</style><rect x="40" y="40" width="300" height="150" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/><line x1="40" y1="115" x2="340" y2="115" class="c"/><line x1="40" y1="40" x2="40" y2="190" stroke="#c92a2a" stroke-width="3"/><text x="48" y="58" font-size="10" text-anchor="start" class="n">X = 0: inner face of the tub front wall</text><text x="48" y="108" font-size="10" text-anchor="start" class="n">Y = 0: centreline (tape line)</text><line x1="60" y1="150" x2="140" y2="150" class="dim" marker-end="url(#ar)"/><text x="150" y="154" font-size="10" text-anchor="start" class="n">+X towards the tailgate</text><line x1="300" y1="115" x2="300" y2="60" class="dim" marker-end="url(#ar)"/><text x="250" y="82" font-size="10" text-anchor="start" class="n">+Y driver</text><text x="190" y="210" font-size="9" text-anchor="middle" class="n">plan view, front of the vehicle on the left</text><rect x="420" y="80" width="300" height="110" fill="#f8f9fa" stroke="#212529" stroke-width="1.5"/><rect x="440" y="182" width="22" height="8" fill="#ced4da" stroke="#495057"/><rect x="490" y="182" width="22" height="8" fill="#ced4da" stroke="#495057"/><rect x="540" y="182" width="22" height="8" fill="#ced4da" stroke="#495057"/><rect x="590" y="182" width="22" height="8" fill="#ced4da" stroke="#495057"/><rect x="640" y="182" width="22" height="8" fill="#ced4da" stroke="#495057"/><rect x="690" y="182" width="22" height="8" fill="#ced4da" stroke="#495057"/><line x1="420" y1="182" x2="720" y2="182" stroke="#c92a2a" stroke-width="3"/><text x="430" y="175" font-size="10" text-anchor="start" class="n">Z = 0: top of the floor ribs</text><line x1="700" y1="175" x2="700" y2="100" class="dim" marker-end="url(#ar)"/><text x="690" y="120" font-size="10" text-anchor="end" class="n">+Z up</text><text x="570" y="210" font-size="9" text-anchor="middle" class="n">side view</text></svg>